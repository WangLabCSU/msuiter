# msuiter release workflow — 建议稿（DRAFT，未启用）
#
# 状态：发布工程预备批产物（v0.1-checklist §3）。启用流程：
#   1. 等 M1s 验收门口径裁决关闭（docs/release/v0.1-checklist.md §7）；
#   2. 版本 bump 0.1.0 + NEWS 收尾（checklist §2）；
#   3. 本文件移入 `.github/workflows/release.yml`（勿保留 docs/release/ 副本），
#      并确认 actions 版本与 dependabot 覆盖一致（同 ci.yml 既有约定）；
#   4. 打 annotated tag `v0.1.0` 于 main（干净树，checklist §6）→ push tag 触发。
#
# 设计（对齐 .github/workflows/ci.yml U-M0-07 约定）：
#   - vendor.tar.xz 单一生成点：仅 build-source 作业跑 `tools/vendor.sh`，
#     二进制作业消费源码 tarball 内附的 vendor.tar.xz（ADR 0002 §3.3：发布期生成、
#     随源码包分发、永不入 git；tarball 内存在性 = CRAN 离线模式自动生效）。
#   - `--check` 作为发布门禁：vendor 基线漂移（ADR 0002 增量行未补，见
#     checklist §8 P1-2）会让本 workflow 直接红——启用前必须先把基线更新转绿。
#   - Rust 工具链钉 MSRV（rustc 1.71）：发布二进制同时充当 MSRV 构建证明
#     （ci.yml msrv 作业语义）；如需更快构建可换 stable，但 MSRV 证明会失去。
#   - error_on 纪律同 ci.yml：release 作业硬失败，不做静默降级。
#
# 触发：仅 tag push（v*）。不会在普通 push/PR 上运行。

on:
  push:
    tags:
      - "v*"

name: Release

permissions:
  contents: write

jobs:
  build-source:
    runs-on: ubuntu-latest
    outputs:
      tarball: ${{ steps.name.outputs.tarball }}
    steps:
      - uses: actions/checkout@v4

      # MSRV 钉定（ADR 0002 §4 证明语义）。runner 自带 rustup。
      - name: Install Rust (MSRV)
        run: |
          rustup toolchain install 1.71.0 --profile minimal
          rustup default 1.71.0
          cargo --version && rustc --version

      # 发布门禁：vendor 生成 + 基线漂移检查（DRIFT 即红）。
      # vendor.sh 产物固定落在 /tmp/msuiter-vendor.tar.xz。
      - name: Generate vendored offline tarball (release discipline, ADR 0002)
        run: |
          sh tools/vendor.sh --check
          cp /tmp/msuiter-vendor.tar.xz src/rust/vendor.tar.xz

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # R CMD build 只打包，不装依赖；此步仅为下方版本号解析提供 R。
      - name: Build source tarball (vendor.tar.xz attached)
        id: build
        run: |
          R CMD build . --no-manual --no-build-vignettes
          echo "tarball=$(ls msuiter_*.tar.gz)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: source-tarball
          path: ${{ steps.build.outputs.tarball }}
          if-no-files-found: error

  build-binaries:
    needs: build-source
    strategy:
      fail-fast: false
      matrix:
        # Linux 二进制有 glibc 亲和性（面向 r-universe 未覆盖时的兜底）；
        # 若只依赖 r-universe 二进制可整体裁掉 matrix。
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (MSRV)
        run: |
          rustup toolchain install 1.71.0 --profile minimal
          rustup default 1.71.0
          cargo --version && rustc --version

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # R CMD INSTALL 需要 Imports 就位（冒烟实录：干净库缺 S7/rlang 会失败）。
      - name: Install Imports (S7, rlang)
        run: Rscript -e 'install.packages(c("S7", "rlang"), repos = "https://cloud.r-project.org")'

      - uses: actions/download-artifact@v4
        with:
          name: source-tarball
          path: pkg

      # 从源码 tarball 安装并产出平台二进制（CRAN 离线模式由包内
      # src/rust/vendor.tar.xz 自动触发，无需环境变量）。
      - name: Build binary package
        shell: bash
        run: |
          R CMD INSTALL --build "pkg/$(ls pkg/msuiter_*.tar.gz)" -l . --no-docs --no-multiarch
          # 产物：macOS .tgz / Windows .zip / Linux .tgz（平台后缀见 R 文档）

      - name: Smoke-load binary
        shell: Rscript {0}
        run: |
          .libPaths(c(normalizePath("."), .libPaths()))
          stopifnot(requireNamespace("msuiter", quietly = TRUE))
          library(msuiter)
          cat("loaded:", as.character(packageVersion("msuiter")), "\n")
          stopifnot(all(c("ms_variants", "ms_tally", "ms_extract", "MsSignature")
                        %in% getNamespaceExports("msuiter")))

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: msuiter_*.*
          if-no-files-found: error

  github-release:
    needs: [build-source, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Release notes：取 NEWS.md 顶部第一节（即本版本节），前置标题行。
      - name: Extract release notes from NEWS.md
        run: |
          awk '/^# msuiter/{n++} n==1{print} n==2{exit}' NEWS.md > release-notes.md
          head -5 release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "msuiter ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            dist/*
