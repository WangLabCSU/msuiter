# Build and deploy the pkgdown site to GitHub Pages on every push to main
# (the repo Pages setting is build_type: workflow; the site URL is
# https://wanglabcsu.github.io/msuiter). The build needs the Rust toolchain
# because the task-guide vignettes exercise the engine through the
# pkgload-based source checkout idiom.
name: pkgdown

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    # house hang-detector law: every job declares a measured budget
    timeout-minutes: 60
    concurrency:
      group: pkgdown-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, any::pkgload, local::.
          needs: website

      - name: Install Rust toolchain (MSRV floor)
        uses: dtolnay/rust-toolchain@1.71.0

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs"
