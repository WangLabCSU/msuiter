# Build and deploy the pkgdown site to GitHub Pages on every push to main
# (the repo Pages setting is build_type: workflow; the site URL is
# https://wanglabcsu.github.io/msuiter/). Mirrors the scheduled site job's
# provisioning shape: the Rust toolchain is installed BEFORE the R
# dependency installation because the local::. face compiles src/rust, and
# every action is SHA-pinned per the house discipline.
name: pkgdown

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    # house hang-detector law: every job declares a measured budget
    timeout-minutes: 60
    concurrency:
      group: pkgdown-${{ github.ref }}
      # a cancelled build is a wasted one, but a cancelled DEPLOY can leave
      # the Pages deployment half-written -- let the running one finish.
      cancel-in-progress: false
    # Pages deployments are gated on a GitHub environment; the job must
    # declare it or deploy-pages refuses (and the URL never resolves).
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "Install Rust toolchain at MSRV (DESCRIPTION: rustc >= 1.71)"
        run: |
          rustup toolchain install 1.71.0 --profile minimal
          rustup default 1.71.0

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          needs: check          # Suggests ride in: the guides render ggplot faces
          extra-packages: any::pkgdown, any::pkgload, any::quarto, local::.

      - name: Build site (release face, lands at the docs/ root)
        run: |
          pkgdown::build_site(override = list(development = list(mode = "release")),
                              new_process = FALSE, install = FALSE, quiet = TRUE)
          # write: Jekyll must pass the docs/ tree byte-unchanged.
          # one explicit extra: Pages must pass the docs/ tree byte-unchanged
          writeLines(character(), file.path("docs", ".nojekyll"))
        shell: Rscript {0}

      - name: Upload the Pages artifact (the docs/ tree, .nojekyll written)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: "docs"

      # The publisher. Without this step the artifact is merely stored and
      # https://wanglabcsu.github.io/msuiter/ stays 404 -- the defect this
      # workflow carried from its first commit until 2026-11-06.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
