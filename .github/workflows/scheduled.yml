# msuiter scheduled deep checks (U-M0-07) — docs/ARCHITECTURE.md §9:
# "valgrind + ASAN/UBSAN scheduled job". Weekly. valgrind and sanitizer are
# diagnostic tripwires allowed to fail (not merge gates); site is a hard
# gate (U-M7-04 slice-C, C5): a site that no longer builds must go red.
#
#   valgrind  : full R CMD check --as-cran --use-valgrind on Linux.
#   sanitizer : RUSTFLAGS -Zsanitizer={address,leak} over the pure numeric
#               crates (msuiter-engine + msuiter-catalog, both
#               #![forbid(unsafe_code)]). The FFI shell links libR, which is
#               not instrumented, so full-workspace sanitizer runs only
#               produce libR false positives; the numeric core is the
#               memory-safety surface we own. The matrix value `undefined`
#               was retired (issue #32 D1): rustc has never accepted it, the
#               leg died at target discovery and produced zero signal while
#               looking red. Both legs now run through
#               tools/deep-checks/run_sanitizer_leg.sh, which enforces the
#               LOUDNESS LAW: the leg goes red unless rustc accepts the
#               flag, the suite genuinely executed, and a reviewed canary
#               violation is actually reported (a dead instrumentation can
#               no longer masquerade as a green/red build).
#   site      : pkgdown::build_site render of the reference site + artifact.
#   vendor-prep : the vendored offline tarball, generated once per run at
#               the ADR 0002 §2 budget (mirror of ci.yml's guard-prep point;
#               a run is its own single generation point).
#   cran-shape-check : the single-process CRAN-shape monolith the PR gate
#               retired from its critical path on 2026-10-22 (round-2): one
#               build+install+check process with the FULL test phase, args
#               c("--no-manual","--as-cran") and the error-level gate
#               verbatim from the leg it displaces. The eight fan-out arms
#               in ci.yml prove the same coverage K-way parallel per PR; this
#               job keeps the one-process CRAN-fidelity witness on this
#               workflow's cadence (weekly cron + manual dispatch). The 4.3
#               floor and devel legs are deliberately NOT duplicated here:
#               their provisioning law (hard-mode Suggests skip, the devel
#               user-agent pin) is carried by the fan-out roster in ci.yml,
#               and a second copy would be budget, not signal.
#
# Sanitizers need -Z flags => nightly toolchain (engine/catalog compile on
# nightly: no unsafe, budget deps only).

name: Scheduled deep checks

on:
  schedule:
    - cron: '23 4 * * 1' # weekly, Monday 04:23 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  _R_CHECK_LIMIT_CORES_: 'true'

jobs:
  # census-exempt tokens: 0   (the vacuous rcmdcheck step retired by the
  # #32 remediation carried the R CMD check shell template placeholder
  # `{0}`; the token is a shell placeholder, not a numeric claim.)
  valgrind:
    runs-on: ubuntu-latest
    # Hard gate: the archived leg carried continue-on-error (D1 class).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind

      # src/rust compiles during R CMD INSTALL inside the check run
      - name: "Install Rust toolchain at MSRV (DESCRIPTION: rustc >= 1.71)"
        run: |
          rustup toolchain install 1.71.0 --profile minimal
          rustup default 1.71.0

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          needs: check

      - name: Valgrind leg (issue #32): native sentry + loudness-law canaries
        run: sh tools/deep-checks/run_valgrind_leg.sh leg

      - name: Upload valgrind check log
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: valgrind-check-log
          path: check-valgrind
          retention-days: 14

  sanitizer:
    runs-on: ubuntu-latest
    # Hard gate: the 22 s/12 s archived legs (D1) died at target discovery.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, leak]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install nightly Rust (for -Z sanitizer flags)
        run: rustup toolchain install nightly --profile minimal

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src/rust
          key: sanitizer-${{ matrix.sanitizer }}

      - name: Sanitizer leg ${{ matrix.sanitizer }} (suite + loudness-law canary)
        shell: bash -e {0}
        run: sh tools/deep-checks/run_sanitizer_leg.sh leg "${{ matrix.sanitizer }}"

  site:
    # pkgdown site-build tripwire (U-M7-04 slice-C, C5). The per-PR 13-check
    # topology is frozen, so the site render rides the weekly deep check (and
    # manual dispatch). STRICT by design -- no continue-on-error: the
    # docs-sync pkgdown-index half only reads _pkgdown.yml, this job proves
    # the site really builds (Rd resolution, article render, citation parse).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # src/rust compiles during the R CMD INSTALL that build_site triggers
      # (install keeps the reference build honest: real namespace loading).
      - name: "Install Rust toolchain at MSRV (DESCRIPTION: rustc >= 1.71)"
        run: |
          rustup toolchain install 1.71.0 --profile minimal
          rustup default 1.71.0

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          needs: check          # Suggests ride in: knitr renders the article
          extra-packages: any::pkgdown

      - name: Build pkgdown site (_pkgdown.yml -> docs/)
        shell: Rscript {0}
        run: |
          if (!requireNamespace("pkgdown")) {
            stop("site check: pkgdown unavailable")
          }
          pkgdown::build_site()
          # development.mode is 'devel' (_pkgdown.yml), so the build lands under
          # docs/dev/ -- the site root is reserved for release builds. Probing
          # docs/ directly would gate on a path this configuration never writes
          # (the D1 lesson generalized: an assertion must observe real output).
          must <- file.path("docs/dev", c("reference/index.html",
                                          "articles/extending.html"))
          for (f in must) {
            if (!file.exists(f)) {
              stop(sprintf("site check: expected rendered file %s missing", f))
            }
          }

      - name: Upload rendered site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: pkgdown-site
          path: docs
          retention-days: 14

  vendor-prep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Same generation recipe as ci.yml's guard-prep (ADR 0002 §3.3): the
      # tarball is built here once and the monolith never touches the
      # network during its --as-cran build.
      - name: Vendor budget check (ADR 0002 §2 drift guard)
        run: |
          rustup toolchain install 1.71.0 --profile minimal
          rustup default 1.71.0
          sh tools/vendor.sh --check
          cp /tmp/msuiter-vendor.tar.xz vendor.tar.xz

      - name: Upload vendor tarball (consumed by cran-shape-check)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vendor-tarball
          path: vendor.tar.xz
          retention-days: 14
          if-no-files-found: error

  cran-shape-check:
    needs: [vendor-prep]
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 90 # the retired leg measured 4881 s in run 39691982548
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release'}
          - {os: windows-latest, r: 'release'}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fetch vendored offline tarball (built by vendor-prep)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vendor-tarball
          path: src/rust

      - name: "Install Rust toolchain at MSRV (DESCRIPTION: rustc >= 1.71)"
        run: |
          rustup toolchain install 1.71.0 --profile minimal
          rustup default 1.71.0

      - name: Provision the GNU target for R Makevars.win
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-gnu

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          needs: check
          extra-packages: any::rcmdcheck
          use-cache: true

      # The monolith itself, verbatim from the retired PR-gate leg: the
      # action's build+install+check runs the FULL test phase in one
      # process. args/error-on are the sealed contract values; error-on is
      # hyphenated (an error_on key is silently dropped -> the warning
      # default) and carries its own quotes (the input is a RAW R
      # expression; CI audit 2026-10-07). upload-snapshots stays true: the
      # test phase executes here, so snapshot evidence is real.
      - uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"error"'
          upload-snapshots: true
