# msuiter scheduled deep checks (U-M0-07) — vignettes/articles/architecture.qmd
# §9: "valgrind + ASAN/UBSAN scheduled job". Nightly since issue #76
# (2026-11-05): this workflow now carries the T1 deep battery, the five
# version arms and the coverage leg the PR gate retired from its critical
# path. valgrind and sanitizer are
# diagnostic tripwires allowed to fail (not merge gates); site is a hard
# gate (U-M7-04 slice-C, C5): a site that no longer builds must go red.
#
#   valgrind  : full R CMD check --as-cran --use-valgrind on Linux.
#   sanitizer : RUSTFLAGS -Zsanitizer={address,leak} over the pure numeric
#               crates (msuiter-engine + msuiter-catalog, both
#               #![forbid(unsafe_code)]). The FFI shell links libR, which is
#               not instrumented, so full-workspace sanitizer runs only
#               produce libR false positives; the numeric core is the
#               memory-safety surface we own. The matrix value `undefined`
#               was retired (issue #32 D1): rustc has never accepted it, the
#               leg died at target discovery and produced zero signal while
#               looking red. Both legs now run through
#               tools/deep-checks/run_sanitizer_leg.sh, which enforces the
#               LOUDNESS LAW: the leg goes red unless rustc accepts the
#               flag, the suite genuinely executed, and a reviewed canary
#               violation is actually reported (a dead instrumentation can
#               no longer masquerade as a green/red build).
#   site      : pkgdown::build_site render of the reference site + artifact.
#   vendor-prep : the vendored offline tarball, generated once per run at
#               the ADR 0002 §2 budget (mirror of ci.yml's guard-prep point;
#               a run is its own single generation point).
#   version-fanout : the six scheduled check arms -- the five version
#               arms plus the ubuntu/release T1 witness -- running the
#               same fan-out body the PR-gate release arms run, at
#               --tier=T0,T1, so the deep battery is witnessed nightly
#               on the wide platform matrix (issue #76).
#   test-heavy   : the tier-T2 provisioning simulations (two check-layout-sim
#               files, 2481 s of committed weight) run nightly through the
#               committed tools/test-heavy.R face -- the local one-command
#               contract and the nightly witness are literally the same code
#               (issue #76: moved out of the per-push path, not out of CI).
#   coverage     : R coverage via covr -> codecov upload, sharded at
#               --tier=T0,T1 (the covr runner refuses an unspoken --tier);
#               the gating census and the zero-fragment merge law moved with
#               the job verbatim (issue #76).
#   cran-shape-check : the single-process CRAN-shape monolith the PR gate
#               retired from its critical path on 2026-10-22 (round-2): one
#               build+install+check process with the FULL test phase, args
#               c("--no-manual","--as-cran") and the error-level gate
#               verbatim from the leg it displaces. The eight fan-out arms
#               in ci.yml prove the same coverage K-way parallel per PR; this
#               job keeps the one-process CRAN-fidelity witness on this
#               workflow's cadence (nightly cron + manual dispatch). The
#               version arms -- 4.3, devel and the three oldrel-1 -- plus an
#               ubuntu/release witness for the T1 tier ride the
#               R-CMD-check-version-fanout job below (roster:
#               tools/ci/scheduled-fanout-configs.tsv), carrying their
#               provisioning law (hard-mode Suggests skip, the devel
#               user-agent pin) verbatim from the PR gate they left on
#               2026-11-05 (issue #76).
#
# Sanitizers need -Z flags => nightly toolchain (engine/catalog compile on
# nightly: no unsafe, budget deps only).

name: Scheduled deep checks

on:
  schedule:
    - cron: '23 4 * * *' # nightly 04:23 UTC (issue #76: the T1 deep battery,
      #                        the version arms and the covr leg earn a
      #                        nightly cadence, not a weekly one)
  workflow_dispatch:

permissions:
  contents: read

env:
  _R_CHECK_LIMIT_CORES_: 'true'

jobs:
  # census-exempt tokens: 0   (the vacuous rcmdcheck step retired by the
  # #32 remediation carried the R CMD check shell template placeholder
  # `{0}`; the token is a shell placeholder, not a numeric claim.)
  valgrind:
    # Pinned, never `-latest`: the hosted image flipped 24.04 -> 26.04, whose
    # uutils coreutils leaks 43673 bytes in /usr/bin/uname. --trace-children=yes
    # walks that child into the trace and the census's HARD ZERO law aborts the
    # leg. Pin the environment; never widen the adjudication (issue #74).
    runs-on: ubuntu-24.04
    # Hard gate: the archived leg carried continue-on-error (D1 class).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind

      # src/rust compiles during R CMD INSTALL inside the check run
      - name: "Install Rust toolchain at MSRV (DESCRIPTION: rustc >= 1.71)"
        run: |
          rustup toolchain install 1.71.0 --profile minimal
          rustup default 1.71.0

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          needs: check

      - name: Valgrind leg (issue #32): native sentry + loudness-law canaries
        run: sh tools/deep-checks/run_valgrind_leg.sh leg

      - name: Upload valgrind check log
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: valgrind-check-log
          path: check-valgrind
          retention-days: 14

  sanitizer:
    runs-on: ubuntu-latest
    # Hard gate: the 22 s/12 s archived legs (D1) died at target discovery.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, leak]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install nightly Rust (for -Z sanitizer flags)
        run: rustup toolchain install nightly --profile minimal

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src/rust
          key: sanitizer-${{ matrix.sanitizer }}

      - name: Sanitizer leg ${{ matrix.sanitizer }} (suite + loudness-law canary)
        shell: bash -e {0}
        run: sh tools/deep-checks/run_sanitizer_leg.sh leg "${{ matrix.sanitizer }}"

  site:
    # Same runner-slowness class as the cargo arms: the render itself is
    # ~1-6 min but provisioning is not. The only GREEN witness (job
    # 121515467347, run 40306103047) consumed 14m02s of the 15 on offer,
    # 10m44s of it in setup-r-dependencies -- green by luck, not margin.
    # (Its red sibling job 125279815359 was a real assertion failure at
    # step 8 in 8m37s, not a timer kill.)
    # 30 = witnessed >=14m tail + one runner-slowness class.
    timeout-minutes: 30  # audit #74 P2 hardening
    # pkgdown site-build tripwire (U-M7-04 slice-C, C5). The per-PR 13-check
    # topology is frozen, so the site render rides the weekly deep check (and
    # manual dispatch). STRICT by design -- no continue-on-error: the
    # docs-sync pkgdown-index half only reads _pkgdown.yml, this job proves
    # the site really builds (Rd resolution, article render, citation parse).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # src/rust compiles during the R CMD INSTALL that build_site triggers
      # (install keeps the reference build honest: real namespace loading).
      - name: "Install Rust toolchain at MSRV (DESCRIPTION: rustc >= 1.71)"
        run: |
          rustup toolchain install 1.71.0 --profile minimal
          rustup default 1.71.0

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          needs: check          # Suggests ride in: knitr renders the article
          extra-packages: any::pkgdown

      - name: Build pkgdown site (_pkgdown.yml -> docs/)
        shell: Rscript {0}
        run: |
          if (!requireNamespace("pkgdown")) {
            stop("site check: pkgdown unavailable")
          }
          pkgdown::build_site()
          # development.mode is 'devel' (_pkgdown.yml), so the build lands under
          # docs/dev/ -- the site root is reserved for release builds. Probing
          # docs/ directly would gate on a path this configuration never writes
          # (the D1 lesson generalized: an assertion must observe real output).
          must <- file.path("docs/dev", c("reference/index.html",
                                          "articles/extending.html"))
          for (f in must) {
            if (!file.exists(f)) {
              stop(sprintf("site check: expected rendered file %s missing", f))
            }
          }

      - name: Upload rendered site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: pkgdown-site
          path: docs
          retention-days: 14

      # US-4 (docs-site v2): deployable bundle + dormant deploy guard. The
      # bundle is the sha256 manifest of the built tree plus the trunk-sha
      # provenance stamp; the deploy step is a no-op-unless-enabled guard
      # reading the MEASURED Pages state (lane probe 2026-11-01: the pages
      # API answers 404 Not Found -- site not provisioned, so the guard can
      # only ever voice DEPLOY DORMANT today). Activation is a separate
      # controller decision; nothing here touches repository settings.
      - name: "Site bundle: sha256 manifest + provenance stamp"
        shell: Rscript {0}
        env:
          MSUITER_TRUNK_SHA: ${{ github.sha }}
        run: |
          res <- system2(file.path(R.home("bin"), "Rscript"),
                         c("tools/site-bundle.R", "--site=docs/dev",
                           "--out=site-bundle",
                           paste0("--rev=", Sys.getenv("MSUITER_TRUNK_SHA", ""))),
                         stdout = TRUE, stderr = TRUE)
          cat(as.character(res), sep = "\n")
          st <- attr(res, "status")
          if (!is.null(st) && st != 0L) {
            stop("site check: the site bundle face failed")
          }

      - name: Upload site bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: pkgdown-site-bundle
          path: site-bundle
          retention-days: 14

      - name: "Deploy to GitHub Pages (dormant guard)"
        shell: Rscript {0}
        run: |
          res <- system2(file.path(R.home("bin"), "Rscript"),
                         c("tools/site-deploy.R", "--live",
                           "--bundle-dir=site-bundle"),
                         stdout = TRUE, stderr = TRUE)
          cat(as.character(res), sep = "\n")
          st <- attr(res, "status")
          if (!is.null(st) && st != 0L) {
            stop("site check: the deploy guard refused (incomplete bundle)")
          }

  vendor-prep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version-matrix: ${{ steps.version-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The version-arm roster is data, not YAML (the same law as the
      # PR-gate fan-out): tools/ci/scheduled-fanout-configs.tsv feeds
      # the matrix of the R-CMD-check-version-fanout job below.
      - name: Emit the scheduled version-arm matrix
        id: version-matrix
        shell: bash
        run: |
          rows=$(awk '!/^#/ && NF { printf "%s{\"os\":\"%s\",\"r\":\"%s\"}", sep, $1, $2; sep="," }' \
            tools/ci/scheduled-fanout-configs.tsv)
          echo "matrix={\"config\":[${rows}]}" >> "$GITHUB_OUTPUT"

      # Same generation recipe as ci.yml's guard-prep (ADR 0002 §3.3): the
      # tarball is built here once and the monolith never touches the
      # network during its --as-cran build.
      - name: Vendor budget check (ADR 0002 §2 drift guard)
        run: |
          rustup toolchain install 1.71.0 --profile minimal
          rustup default 1.71.0
          sh tools/vendor.sh --check
          cp /tmp/msuiter-vendor.tar.xz vendor.tar.xz

      - name: Upload vendor tarball (consumed by cran-shape-check)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vendor-tarball
          path: vendor.tar.xz
          retention-days: 14
          if-no-files-found: error

  R-CMD-check-version-fanout:
    # Uniform 180: budgets are hang detectors sized to the measured tail, and
    # the measured tail is RUNNER-random, not arm-random. Witness 1 (run
    # 39815352743): ubuntu/oldrel-1 ate 19m45s setup-r + 15m25s deps, its
    # healthy wave severed at the 60 mark. Witness 2 (run 39839340513):
    # ubuntu/release ate 23m16s + 10m45s of the same slowness and died the
    # same death -- an arm whitelist is whack-a-mole. Healthy arms measure
    # 24-41 min; 120 carried a 40-min stalled setup plus wave with headroom
    # until the 2026-10-30/31 pair on main@a6c5870 (push-run 41082179842):
    # R devel burned the whole 120 TWICE -- attempt-1 job 124154845151
    # (2h01m03s) and its targeted rerun-failed attempt-2 job 124412728178
    # (2h00m31s), both with steps 1-13 completed/success (setup-r, deps,
    # banner attest, no-test check, shared INSTALL), the fan-out wave
    # severed mid-flight, post-steps clean, zero hang signatures. Same
    # co-tenancy straggler family the coverage arm met thrice at 120 and
    # ratcheted to 180; the deep-check legs' own <=120 bounds are unrelated.
    # 180 = witnessed >=120m straggler floor + one runner-slowness class.
    timeout-minutes: 180
    needs: [vendor-prep]
    runs-on: ${{ matrix.config.os }}
    name: R-CMD-check-version-fanout (${{ matrix.config.os }} / R ${{ matrix.config.r }})
    # R devel is informative only (r-lib convention): the law travels with
    # the arm, verbatim, from the retired monolithic matrix.
    continue-on-error: ${{ matrix.config.r == 'devel' }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.vendor-prep.outputs.version-matrix).config }}

    steps:
      # fetch-depth: 0 -- audit #74 P1-6, same era-gate reachability defect the
      # PR fanout carries: the P10-A law resolves PROVENANCE's era commit with
      # `git cat-file -t <sha>^{commit}` and depth-1 makes that ancestor
      # unreachable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # CRAN-mode offline build: the vendored tarball generated once by the
      # vendor-prep job is dropped where Makevars expects it, so R CMD INSTALL
      # never touches the network (a --as-cran WARNING otherwise, and no
      # vendor.tar.xz is ever committed -- ADR 0002 §3.3).
      - name: Fetch vendored offline tarball (built by vendor-prep)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vendor-tarball
          path: src/rust

      # src/rust builds during R CMD INSTALL/check; the MSRV from DESCRIPTION
      # SystemRequirements (rustc >= 1.71) is used so every R job also
      # exercises the 1.71 toolchain on all three OSes.
      - name: "Install Rust toolchain at MSRV (DESCRIPTION: rustc >= 1.71)"
        run: |
          rustup toolchain install 1.71.0 --profile minimal
          rustup default 1.71.0

      - name: Provision the GNU target for R Makevars.win
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-gnu

      # The devel arm carries the compatibility user-agent the monolithic
      # matrix pinned for its informative leg; split like the dependency
      # steps below so the input is physically absent on every other arm.
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        if: matrix.config.r != 'devel'
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        if: matrix.config.r == 'devel'
        with:
          r-version: 'devel'
          use-public-rspm: true
          http-user-agent: 'R/4.3.0 (github-actions)'

      # Fail-closed R-version attestation (CI warning-zero lane, 2026-10-23):
      # the 4.3 arm's banner was certified this week by five manual greps over
      # an archived log; the arm now speaks the fact itself -- resolved version,
      # DESCRIPTION floor, and a numeric matrix label must match what the
      # resolver actually delivered (a silent fallback reddens the step).
      - name: Attest the R version banner (fail-closed)
        shell: bash
        run: Rscript tools/ci/attest-r-version.R --label='${{ matrix.config.r }}'

      # Never pass an empty `dependencies` input: the action interpolates it
      # into pak's R call and the empty string yields the broken expression
      # `dependencies = c(needs, ())` -- "unexpected ')'" in Dependency
      # resolution, killing all matrix arms (CI audit 2026-10-07). Split
      # into two guarded steps so the input is physically absent unless set;
      # only the 4.3 floor arm needs it ('"hard"' skips the unsolvable
      # Bioc Suggests chain, round-3 audit).
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        if: matrix.config.r != '4.3'
        with:
          needs: check
          extra-packages: any::rcmdcheck

      # install-pandoc must be explicit on the floor arm: the action's auto
      # probe calls pkg_deps(".", dependencies = list(direct = "all")) --
      # dragging in the very Suggests this arm cannot solve -- and dies
      # resolving BSgenome.Hsapiens.UCSC.hg19 before any install runs (CI
      # audit 2026-10-07). 'true' skips the probe and ships the pandoc the
      # knitr vignette needs; the CRAN-only extras keep the Bioc Suggests
      # chain out of the solve while keeping the vignette build (this arm's
      # check still builds it) and the sharded tests runnable. sigminer must
      # NOT join these extras: it imports maftools -> VariantTools/S4Vectors,
      # which live only in the Bioc 3.18 series that 4.3 needs -- and that
      # series answers 404 on every canonical mirror (run 39753886611's
      # solve died exactly there). The xval shard it alone powers is
      # therefore EXCLUDED BY DECLARATION for this arm
      # (tools/ci/shard-exclusions.tsv), not silently vacuous.
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        if: matrix.config.r == '4.3'
        with:
          needs: check
          dependencies: '"hard"'
          install-pandoc: true
          extra-packages: >-
            any::rcmdcheck, any::knitr, any::rmarkdown,
            any::testthat, any::withr, any::ggplot2,
            any::ggalluvial, any::uwot

      # The displaced serial test phase returns below as K attested shards;
      # the Rd-examples leg rides the check phase of this call and the
      # vignette leg its build phase (phase-marker probes banked with the
      # round-2 lane manifest, 2026-10-22). The two env guards and the
      # error-level gate are the retired wrapper's own verbatim law: CRAN-
      # shape strictness depends on optional external tools not uniformly
      # available across runner OSes (checkbashisms is absent on macos/
      # windows runners and flags every fresh submission), so the PR gate
      # errors on ERRORs only -- warnings/notes are informational, and the
      # hard gates live in the guards job and the scheduled deep checks.
      # The retired wrapper's snapshot upload is not mirrored: under
      # --no-tests no snaps exist at check time (its own step carried
      # if-no-files-found: ignore); the test phase's snapshot evidence
      # travels with the shard transcripts, dumped in full on red by
      # shard-transcripts.sh below.
      - name: Check without the test phase (CRAN-shape build+check, error gate)
        shell: Rscript {0}
        run: |
          if (Sys.getenv("_R_CHECK_FORCE_SUGGESTS_", "") == "") Sys.setenv("_R_CHECK_FORCE_SUGGESTS_" = "false")
          if (Sys.getenv("_R_CHECK_CRAN_INCOMING_", "") == "") Sys.setenv("_R_CHECK_CRAN_INCOMING_" = "false")
          check_results <- rcmdcheck::rcmdcheck(
            args = c("--no-manual", "--as-cran", "--no-tests"),
            build_args = "--no-manual",
            error_on = "error",
            check_dir = "check")

      # Failure-only post-mortem evidence (the retired wrapper's upload law:
      # the whole check tree ships when the leg went red).
      - name: Upload check results (post-mortem evidence, failure only)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: check-results-${{ matrix.config.os }}-${{ matrix.config.r }}
          path: check
          retention-days: 1
          if-no-files-found: warn

      # One shared INSTALL of the tree under test; the K shard processes run
      # it back in parallel, each filtering the manifest to its roster. The
      # run is from the CHECKOUT with load_package = "installed", so the
      # helpers' ancestor walk resolves .ms_root and the drift guards and
      # the check-layout-sim family execute -- a superset of what the old
      # single process covered, never weaker. Docs/vignettes are not needed
      # by the shards (Rd examples and vignette execution are gated inside
      # the check step above, against its own full install).
      - name: R CMD INSTALL (one build of the tree, shared by all shards)
        shell: bash
        run: |
          # INSTALL's option parser does not know vignette options: this
          # flag only ever emitted "Warning: unknown option
          # '--no-build-vignettes'" (push-run 39864490318, every fan-out arm).
          R CMD INSTALL --no-docs .

      - name: Repo-layout testthat fan-out (K shards, attested)
        # The version arms are scheduled, not per-push: they carry the
        # T1 deep battery beside the T0 PR-gate battery (issue #76).
        shell: bash
        run: |
          mkdir -p attest-out shard-logs
          k=$(awk '/^#[[:space:]]*k=/{sub(/^#[[:space:]]*k=[[:space:]]*/,"");print;exit}' tools/ci/shard-manifest.tsv)
          tag="${{ matrix.config.os }}-${{ matrix.config.r }}"
          pids=""; rc=0
          for s in $(seq 1 "$k"); do
            # Sanctioned-skip ledger (tools/ci/shard-exclusions.tsv): a
            # registered (arm, shard) pair is spoken for by the aggregator's
            # own --write-exclusion-marker renderer, so the marker bytes can
            # never drift from the ledger and this script invents nothing.
            # rc=3 means "not registered: run the shard"; any other nonzero
            # is a broken ledger and dies the arm loud.
            exclrc=0
            python3 tools/ci/ci-shard-aggregate.py --write-exclusion-marker \
              --exclusions tools/ci/shard-exclusions.tsv \
              --tag "$tag" --shard "$s" \
              --out "attest-out/shard-$s-$tag.excl" || exclrc=$?
            if [ "$exclrc" -eq 0 ]; then
              echo "shard $s: excluded by the sanctioned-skip ledger for $tag"
              continue
            elif [ "$exclrc" -ne 3 ]; then
              echo "sanctioned-skip ledger lookup failed (rc=$exclrc) for shard $s of $tag"
              exit 2
            fi
            rm -f "attest-out/shard-$s-$tag.excl"
            Rscript tools/ci/run-testthat-shard.R \
              --manifest=tools/ci/shard-manifest.tsv --shard="$s" \
              --kind=fanout --mode=installed \
              --tier=T0,T1 \
              --attest="attest-out/shard-$s-$tag.attest" \
              > "shard-logs/shard-$s.log" 2>&1 &
            pids="$pids $!"
          done
          for p in $pids; do wait "$p" || rc=1; done
          echo "::group::shard transcripts (tail)"
          for f in shard-logs/*.log; do echo "-- $f --"; tail -n 25 "$f"; done
          echo "::endgroup::"
          [ "$rc" -eq 0 ] || bash tools/ci/shard-transcripts.sh
          test "$rc" -eq 0 || exit "$rc"
          python3 tools/ci/ci-shard-aggregate.py \
            --manifest tools/ci/shard-manifest.tsv \
            --attest-dir attest-out --kind fanout \
            --tier T0,T1 \
            --t0-budget tools/ci/pr-gate-budget.tsv \
            --fanout-configs tools/ci/scheduled-fanout-configs.tsv \
            --exclusions tools/ci/shard-exclusions.tsv \
            --expect-config "${{ matrix.config.os }}-${{ matrix.config.r }}"

      - name: Upload fan-out attestations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: attest-version-fanout-${{ matrix.config.os }}-${{ matrix.config.r }}
          path: attest-out
          retention-days: 1
          if-no-files-found: error

  coverage:
    # Moved verbatim from ci.yml by issue #76 (2026-11-05): the
    # coverage leg instruments the committed suite, does not gate
    # the pull request, and earns its keep nightly.
    # R-side coverage upload only; no percentage gate here (R >= 85% is a
    # later target, ARCHITECTURE §9). Rust coverage is not gated (also
    # ARCHITECTURE §9). The attestation census, however, gates (law of
    # 2026-10-24): the aggregator's --advisory printed defects and exited
    # green for a year -- a vacuous green in the gate itself. Shards must
    # attest executed work; the installed-copy context's structural absences
    # (checkout-locating files skip there) are sanctioned byte-exactly by
    # tools/ci/covr-divergences.tsv, reverse-audited -- a ledger row that
    # sanctions nothing is itself a defect.
    # Hot path measures 18 min (run 39815352743); witness run 39839340513
    # ate 40 min of runner-slowness setup before covr even started, and the
    # 60-minute timer beheaded a healthy shard mid-flight -- 90 carried the
    # stall class with headroom. The headroom ran out: PR #52 consumed the
    # full 90 twice (runs 40013789288/40028404425) while main's measured
    # tail already reached 68m53s (push-run 39965044133); the weights table
    # prices files in testthat seconds, blind to the covr-instrumented cost
    # of new files. 120 carried the then-measured tail plus witness excess;
    # the in-wave heartbeat turns any future timer kill into a measurement
    # (attest rising = slow-but-live, attest flat + live pinned = hang).
    # Ratchet 120->180 (PR #56 lineage, triple ceiling witness): run
    # 40667262104 job 122744792649 ran 120m27s (09:49:35->11:50:02Z), run
    # 40700329158 attempt 1 job 122858082848 ran 120m26s (13:51:43->
    # 15:52:09Z), and the same job's targeted rerun attempt 2 ran 120m34s
    # (15:58:33->17:59:07Z), each heartbeating attest flat 5/6 + live
    # pinned 1/7 for the final hour -- the straggler-shard class of
    # the PR #52 record, re-created by the manifest re-pack, not by
    # content: the 14 content arms stayed green throughout and the
    # 26m00s clean pass (push-run 40614650936) proves the wave is sound. 180 carries the straggler floor
    # (>=118m witnessed) with one runner-slowness class of headroom.
    timeout-minutes: 180
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 -- audit #74 P1-6: the covr wave instruments and runs the
      # same T0 roster, so the P10-A era gate resolves history here too.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain at MSRV
        run: |
          rustup toolchain install 1.71.0 --profile minimal
          rustup default 1.71.0

      - name: Provision the GNU target for R Makevars.win
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-gnu
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          needs: coverage
          extra-packages: any::covr

      # Test-phase coverage, sharded: one instrumented package_coverage
      # (type="tests") per manifest shard, in parallel. covr's
      # instrumentation can break individual tests without implying a
      # package regression (the same suite passes in R-CMD-check-fanout on
      # the same commit), so each shard is continue-on-error and the merged
      # artifacts are what the upload consumes.
      - name: Generate R coverage per shard (covr, attested)
        continue-on-error: true
        run: |
          mkdir -p covr-out covr-srt covr-logs
          k=$(awk '/^#[[:space:]]*k=/{sub(/^#[[:space:]]*k=[[:space:]]*/,"");print;exit}' tools/ci/shard-manifest.tsv)
          # The examples/vignettes legs ride the SAME parallel wave as the
          # test shards (the historical type="all" was tests+examples+
          # vignettes in one process; here the shards carry the tests leg
          # and these two instrumented passes carry the rest). They once ran
          # as an inline heredoc whose covr::to_srt call -- an object covr
          # does not export -- killed the child unattested behind
          # continue-on-error (push-run 39864490318: fragments=3 not 5). The
          # committed runner attests every outcome; pre-clean stays off for
          # the shared-cargo-target law run-covr-shard.R documents.
          pids=""
          for s in $(seq 1 "$k"); do
            Rscript tools/ci/run-covr-shard.R \
              --manifest=tools/ci/shard-manifest.tsv --shard="$s" \
              --out-srt="covr-srt/shard-$s.srt" \
              --tier=T0,T1 \
              --attest="covr-out/shard-$s.attest" \
              > "covr-logs/shard-$s.log" 2>&1 &
            pids="$pids $!"
          done
          Rscript tools/ci/run-covr-extras.R --out-srt-prefix=/tmp \
            > covr-logs/extras.log 2>&1 &
          pids="$pids $!"
          rc=0
          # Heartbeat: attest/live census on the step stream every 120s. The
          # post-wait transcript echo below never runs when the job timer
          # fires, so without this a killed wave leaves no progress curve
          # (PR #52 double-90-min audit: two full-budget deaths, silence as
          # the only evidence). attest is over the k test shards (extras
          # attests to its own /tmp prefix); live over the whole wave.
          total=$((k + 1))
          t=0
          while [ "$(jobs -r | wc -l | tr -d ' ')" != "0" ]; do
            echo "covr-heartbeat t=${t}s attest=$(ls covr-out 2>/dev/null | wc -l | tr -d ' ')/$k live=$(jobs -r | wc -l | tr -d ' ')/$total"
            t=$((t + 120)); sleep 120
          done
          for p in $pids; do wait "$p" || rc=1; done
          echo "::group::covr transcripts (tail)"
          for f in covr-logs/*.log; do echo "-- $f --"; tail -n 25 "$f"; done
          echo "::endgroup::"

      # The census gates (law of 2026-10-24 -- the --advisory non-gate let
      # a year of broken coverage exit green). It rides its own step, outside
      # the wave's continue-on-error umbrella, so a missing, vacuous or
      # off-ledger attestation reddens the job; the diagnosability step below
      # still fires on the failure.
      - name: Census the covr attestations (gates)
        run: |
          python3 tools/ci/ci-shard-aggregate.py \
            --manifest tools/ci/shard-manifest.tsv \
            --attest-dir covr-out --kind coverage \
            --ledger tools/ci/covr-divergences.tsv \
            --tier T0,T1

      - name: Echo failed testthat output (diagnosability)
        if: failure()
        shell: bash
        run: |
          for f in covr-logs/*.log; do echo "-- $f (tail) --"; tail -n 40 "$f"; done
          FAILFILE=$(find /tmp -name "testthat.Rout.fail" 2>/dev/null | head -1)
          if [ -n "$FAILFILE" ]; then
            echo "=== $FAILFILE (tail) ==="
            tail -80 "$FAILFILE"
          fi

      - name: Merge coverage fragments (covmerge)
        run: |
          fragments=""
          for f in covr-srt/*.srt /tmp/msuiter-extras-*.srt; do
            [ -f "$f" ] && fragments="$fragments $f"
          done
          test -n "$fragments" || { echo "::error::no coverage fragments produced -- coverage lane vacuous"; exit 1; }
          # shellcheck-disable-next-line SC2086: fragment paths are CI-owned
          python3 tools/ci/covmerge.py --fragments $fragments \
            --out-srt /tmp/msuiter-merged.srt --cobertura cobertura.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: cobertura.xml
          flags: r
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
  test-heavy:
    # Tier-T2 (issue #76): the two check-layout-sim provisioning simulations
    # measured 1250 s + 1231 s on the 2026-11-04 witness table -- no pull
    # request needs them, no release may silently stop running them. Single
    # Linux release-R arm; the committed face is both the local contract and
    # this witness (one code, two cadences). The 120-minute line: 2481 s of
    # committed T2 weight + the setup/build class + one runner-slowness
    # class of headroom -- hang detector, not starvation engine (the
    # 2026-10-22 budget law).
    timeout-minutes: 120
    needs: [vendor-prep]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fetch vendored offline tarball (built by vendor-prep)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vendor-tarball
          path: src/rust

      - name: "Install Rust toolchain at MSRV (DESCRIPTION: rustc >= 1.71)"
        shell: bash
        run: |
          rustup toolchain install 1.71.0 --profile minimal
          rustup default 1.71.0

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          needs: soft # Suggests (testthat, withr): the heavy face runs testthat

      - name: Attest the R version banner (fail-closed)
        shell: bash
        run: Rscript tools/ci/attest-r-version.R --label=heavy-nightly

      - name: R CMD INSTALL (the tree under test)
        shell: bash
        run: R CMD INSTALL --no-docs .

      - name: Tier-T2 heavy battery through the committed face
        # The face is its own gate: zero-executed deaths and loud failures
        # reddened its exit (self-tested controls), so no separate census
        # consumer is needed for kind=heavy evidence.
        shell: bash
        run: Rscript tools/test-heavy.R --root=. --tier=T2

  cran-shape-check:
    needs: [vendor-prep]
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 90 # the retired leg measured 4881 s in run 39691982548
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release'}
          - {os: windows-latest, r: 'release'}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fetch vendored offline tarball (built by vendor-prep)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vendor-tarball
          path: src/rust

      - name: "Install Rust toolchain at MSRV (DESCRIPTION: rustc >= 1.71)"
        run: |
          rustup toolchain install 1.71.0 --profile minimal
          rustup default 1.71.0

      - name: Provision the GNU target for R Makevars.win
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-gnu

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          needs: check
          extra-packages: any::rcmdcheck

      # The monolith itself, verbatim from the retired PR-gate leg: the
      # action's build+install+check runs the FULL test phase in one
      # process. args/error-on are the sealed contract values; error-on is
      # hyphenated (an error_on key is silently dropped -> the warning
      # default) and carries its own quotes (the input is a RAW R
      # expression; CI audit 2026-10-07). upload-snapshots stays true: the
      # test phase executes here, so snapshot evidence is real.
      - uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"error"'
          upload-snapshots: true
