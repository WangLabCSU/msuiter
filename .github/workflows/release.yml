# msuiter release workflow -- ENABLED (2026-10-05; the release chain runs after
# the PI ruling (1), plan A).
#
# Enabling record: M1s closed 14/14 (plan-A accounting); version bump 0.1.0;
# this file moved in from
# docs/release/release.yml-draft.yml. Trigger = an annotated tag `v0.1.0`
# push (the tag is cut on a clean main tree).
#
# Design (aligned with the .github/workflows/ci.yml U-M0-07 conventions):
#   - Single generation point for vendor.tar.xz: only the build-source job runs
#     `tools/vendor.sh`;
#     the binary jobs consume the vendor.tar.xz embedded in the source tarball
#     (ADR 0002 section 3.3: generated at release time,
#     shipped with the source package, never committed to git; its presence in
#     the tarball = the CRAN offline mode activates automatically).
#   - `--check` as a release gate: vendor baseline drift (an ADR 0002 increment
#     row not filled in, see
#     checklist section 8 P1-2) turns this workflow straight red -- the baseline
#     update must be green before enabling.
#   - The Rust toolchain is pinned to the MSRV (rustc 1.71): the release
#     binaries double as the MSRV build attestation
#     (the ci.yml msrv-job semantics); switching to stable builds faster but
#     loses the MSRV attestation.
#   - The error_on discipline follows ci.yml: release jobs fail hard, no
#     silent degradation.
#
# Trigger: tag push only (v*). Never runs on an ordinary push or PR.

on:
  push:
    tags:
      - "v*"

name: Release

permissions:
  contents: write

jobs:
  build-source:
    runs-on: ubuntu-latest
    outputs:
      tarball: ${{ steps.name.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # MSRV pin (the ADR 0002 section 4 attestation semantics). The runner ships rustup.
      - name: Install Rust (MSRV)
        run: |
          rustup toolchain install 1.71.0 --profile minimal
          rustup default 1.71.0
          cargo --version && rustc --version

      # Release gate: vendor generation + baseline-drift check (DRIFT goes red).
      # The vendor.sh artifact always lands at /tmp/msuiter-vendor.tar.xz.
      - name: Generate vendored offline tarball (release discipline, ADR 0002)
        run: |
          sh tools/vendor.sh --check
          cp /tmp/msuiter-vendor.tar.xz src/rust/vendor.tar.xz

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: release
          use-public-rspm: true

      # R CMD build only packages and installs no dependencies; this step exists
      # simply to provide R for the version parsing below.
      - name: Build source tarball (vendor.tar.xz attached)
        id: build
        run: |
          R CMD build . --no-manual --no-build-vignettes
          echo "tarball=$(ls msuiter_*.tar.gz)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: source-tarball
          path: ${{ steps.build.outputs.tarball }}
          if-no-files-found: error

  build-binaries:
    needs: build-source
    strategy:
      fail-fast: false
      matrix:
        # The Linux binaries carry glibc affinity (the fallback for what r-universe
        # does not cover);
        # if only r-universe binaries are relied on, the whole matrix can be cut.
        os: [macos-latest, ubuntu-latest, windows-latest]
        include:
          # Windows: R's official binaries are GNU-toolchain builds, and
          # R's Makevars force --target=x86_64-pc-windows-gnu (audit
          # 2026-10-06: the msvc host alone fails with E0463 can't find
          # crate for core/std).
          - os: windows-latest
            rust_targets: "x86_64-pc-windows-msvc x86_64-pc-windows-gnu"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust (MSRV + targets)
        shell: bash
        run: |
          rustup toolchain install 1.71.0 --profile minimal
          rustup default 1.71.0
          rustup target add x86_64-pc-windows-gnu
          cargo --version && rustc --version
          rustup target list --installed

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: release
          use-public-rspm: true

      # R CMD INSTALL needs Imports in place (smoke-test record: it fails on a clean
      # library missing S7/rlang).
      - name: Install Imports (S7, rlang)
        run: Rscript -e 'install.packages(c("S7", "rlang"), repos = "https://cloud.r-project.org")'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: source-tarball
          path: pkg

      # Install from the source tarball and produce the platform binaries (the CRAN
      # offline mode is triggered automatically by the package-internal
      # src/rust/vendor.tar.xz; no environment variable needed).
      - name: Build binary package
        shell: bash
        run: |
          # $(ls pkg/...) already carries the pkg/ prefix (the audited
          # draft double-prefixed it: pkg/pkg/... -> "no packages specified").
          R CMD INSTALL --build "$(ls pkg/msuiter_*.tar.gz)" -l . --no-docs --no-multiarch
          # Artifacts: macOS .tgz / Windows .zip / Linux .tgz (see the R docs for the
          # platform suffixes)

      - name: Smoke-load binary
        shell: Rscript {0}
        run: |
          .libPaths(c(normalizePath("."), .libPaths()))
          stopifnot(requireNamespace("msuiter", quietly = TRUE))
          library(msuiter)
          cat("loaded:", as.character(packageVersion("msuiter")), "\n")
          stopifnot(all(c("ms_variants", "ms_tally", "ms_extract", "MsSignature")
                        %in% getNamespaceExports("msuiter")))

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: binary-${{ matrix.os }}
          path: msuiter_*.*
          if-no-files-found: error

  github-release:
    needs: [build-source, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true

      # Release notes: take the top section of NEWS.md (this version's section),
      # with a title line prepended.
      - name: Extract release notes from NEWS.md
        run: |
          awk '/^# msuiter/{n++} n==1{print} n==2{exit}' NEWS.md > release-notes.md
          head -5 release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "msuiter ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            dist/*
