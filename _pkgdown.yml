# The pkgdown site face. The user-facing learning path lives in the tiered
# articles (Get started -> Core workflows -> Statistics -> Applications ->
# Performance -> the governance corpus, research dossiers, reviews and the
# campaign devlog, all converted from the former docs/ tree). The site is
# built and published by .github/workflows/pkgdown.yaml (GitHub Actions ->
# GitHub Pages, build_type: workflow).
url: https://wanglabcsu.github.io/msuiter

template:
  bootstrap: 5

# Two build faces read this file. `.github/workflows/pkgdown.yaml` publishes,
# and overrides the mode to "release" so the Pages artifact root is docs/;
# `.github/workflows/scheduled.yml` runs a bare build_site(), which lands under
# docs/dev/ -- the preview namespace this setting reserves. Both workflows
# assert the paths their own face writes.
development:
  mode: devel

navbar:
  structure:
    left: [intro, get-started, articles, reference, news]
    right: [github]
  components:
    get-started:
      text: Get started
      href: articles/get-started.html
    news:
      text: News
      href: news/index.html

reference:
- title: The object model (S7)
  desc: The central objects and the construction entry points (developer preview, the API marked experimental). The full function-to-concept-to-pillar map is the MSU-map article (articles/msu-map.html).
  contents:
  - ms_variants
  - ms_catalog
  - ms_signature
  - ms_refdb
  - MsVariants
  - MsCatalog
  - MsSignature
  - MsFit
  - MsRefDb
  - MsBenchmark
- title: Fitting and benchmarking
  desc: Reference-based fitting against a signature database, and the benchmark matrix that compares engines on a shared grid.
  contents:
  - ms_fit
  - ms_benchmark
  - fit_engine
- title: The engine registry (the extension interface)
  desc: Third-party packages register engines via .onLoad(); the trust boundary and the onboarding checklist are in CONTRIBUTING.md.
  contents:
  - register_ms_engine
  - match_ms_engine
  - required_pkgs
  - ms_engines
  - MsEngine
- title: Diagnostics
  desc: The environment and provenance status report.
  contents:
  - ms_sitrep
- title: Engine implementations
