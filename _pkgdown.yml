  - ms_fit_bootstrap
  - plot_boot_ci
  - plot_boot_distribution
  - plot_boot_stability
- title: Stratification, clustering and embedding
  desc: The hypermutator stratification, signature clustering and the exposure-space embedding.
  contents:
  - ms_stratify_hypermutants
  - MsStratification
  - plot_hypermutator_burden
  - ms_cluster_signatures
  - ms_embed
  - plot_embedding
- title: Similarity and exposure comparison
  desc: The calibrated-similarity library, the comparison container, the exposure statistical test and their figure types.
  contents:
  - ms_compare
  - ms_comparison
  - MsComparison
  - ms_exposure_test
  - plot_similarity_heatmap
  - plot_exposure_heatmap
