# The pkgdown minimal skeleton (the M0 governance file, U-M0-08).
# The full site (the MSU↔function mapping table, the performance-anchoring documentation, etc.) is extended when docs/ROADMAP.md M7 delivers.
url: https://github.com/WangLabCSU/msuiter

template:
  bootstrap: 5

development:
  mode: devel

navbar:
  structure:
    left: [intro, reference, news, docs]
    right: [github]
  components:
    news:
      text: News
      href: news/index.html
    docs:
      text: Docs
      href: https://github.com/WangLabCSU/msuiter/tree/main/docs

reference:
- title: The object model (S7)
  desc: The central objects and the construction entry points (developer preview, the API marked experimental). The full function-to-concept-to-pillar map is docs/MSU-MAP.md (https://github.com/WangLabCSU/msuiter/blob/main/docs/MSU-MAP.md).
  contents:
  - ms_variants
  - ms_catalog
  - ms_signature
  - ms_refdb
  - MsVariants
  - MsCatalog
  - MsSignature
  - MsFit
  - MsRefDb
  - MsBenchmark
- title: Fitting and benchmarking
  contents:
  - ms_fit
  - ms_benchmark
  - fit_engine
- title: The engine registry (the extension interface)
  desc: Third-party packages register engines via .onLoad(); the trust boundary and the onboarding checklist are in CONTRIBUTING.md.
  contents:
  - register_ms_engine
  - match_ms_engine
  - required_pkgs
  - ms_engines
  - MsEngine
- title: Diagnostics
  contents:
  - ms_sitrep
- title: Engine implementations
  desc: The fitting entry points of the NMF/ARD/sparse trio of engines (dispatched through the engine registry).
  contents:
  - ms_ard
  - MsArd
  - ms_nmf
  - MsNmf
  - ms_sparse
  - MsSparse
- title: Extraction and k selection
  desc: The tally/extract path and the k-selection evidence (CV/stability/reconstruction panel).
  contents:
  - ms_tally
  - ms_extract
  - ms_select_k
  - plot_k_cv_curve
  - plot_k_stability
  - plot_reconstruction_panel
- title: Monte-Carlo calibration
  desc: The calibration grid, the real-data sanity and the verdicts (incl. the coverage curves).
  contents:
  - ms_calibration_grid
  - ms_calibration_sanity
  - print.ms_calibration_sanity
  - ms_calibration_verdict
  - plot_calibration_curve
- title: Bootstrap and stability
  desc: The bootstrap confidence intervals and the stability-evidence figures.
  contents:
  - ms_fit_bootstrap
  - plot_boot_ci
  - plot_boot_distribution
  - plot_boot_stability
- title: Stratification, clustering and embedding
  desc: The hypermutator stratification, signature clustering and the exposure-space embedding.
  contents:
  - ms_stratify_hypermutants
  - MsStratification
  - plot_hypermutator_burden
  - ms_cluster_signatures
  - ms_embed
  - plot_embedding
- title: Similarity and exposure comparison
  desc: The calibrated-similarity library, the comparison container, the exposure statistical test and their figure types.
  contents:
  - ms_compare
  - ms_comparison
  - MsComparison
  - ms_exposure_test
  - plot_similarity_heatmap
  - plot_exposure_heatmap
  - plot_exposure_riverplot
  - plot_exposure_stacked
- title: The visualization panel
  desc: The catalog profile, the COSMIC scatter, the reference comparison and the signature-catalog figures.
  contents:
  - plot_catalog_profile
  - plot_cosmic_scatter
  - plot_reference_comparison
  - plot_signature_catalog
- title: Import and export
  desc: The COSMIC/SigProfiler interoperability, the format conversion and the bundled reference-library faces.
  contents:
  - ms_import
  - ms_export
  - ms_convert
  - plot_opportunity_distribution
  - ms_refdb_bundled
  - ms_refdb_manifest
  - ms_catalog_registry
  - ms_catalog_currency
  - ms_catalog_currency_update
  - print.ms_catalog_currency_report
- title: Input construction and utilities
  desc: The variant/breakpoint input constructors, downsampling, simulation and the presence test.
  contents:
  - ms_segments
  - ms_sv
  - ms_downsample
  - ms_simulate
  - ms_test_presence
- title: QC and reporting
  desc: The QC report, its sibling sentries surfaces and the HRD report faces.
  contents:
  - ms_qc_report
  - ms_qc_burden
  - print.MsQcBurden
  - ms_qc_sentries
  - print.MsQcSentries
  - ms_qc_mechanism_channels
  - print.MsQcMechanismChannels
  - ms_qc_artifact_roster
  - print.MsQcArtifactRoster
  - ms_qc_roster_share
  - print.MsQcRosterShare
  - ms_qc_provenance
  - print.MsQcProvenance
  - plot_qc_dashboard
  - plot_pseudosig_contribution
  - ms_hrd_report
  - print.MsHrdReport
  - as.data.frame.MsHrdReport
  - ms_treatment_report
  - print.MsTreatmentReport
  - as.data.frame.MsTreatmentReport
- title: The benchmark-matrix driver
  desc: The scenario constructor and the driving loop (the naming ruling is in the 2026-10-10 decision record of docs/devlog).
  contents:
  - ms_benchmark_grid
  - ms_run_benchmark

# articles: the vignette rendering list (pkgdown picks the same-named source files under vignettes/ by name).
# Section form per pkgdown >= 2.0 (issue #32 D3): each entry is a list with
# a title and a contents list; the bare string list the M0 skeleton carried
# was rejected by the sitrep articles check ("articles must be a list, not
# the string"). The single vignette under vignettes/ stays named explicitly
# -- no default-index fallback, the audit stays load-bearing.
articles:
- title: Tour: from variants to a reference comparison
  contents:
  - tour
- title: Application scenarios: atlas, HRD and treatment forensics
  contents:
  - scenarios
- title: "Performance anchoring: frozen floors, witnesses and reproduction"
  contents:
  - performance-anchoring
- title: Extending msuiter
  contents:
  - extending
